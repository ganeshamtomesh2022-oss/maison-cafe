<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maison Café | Owner Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#111210;color:#f6efdf;font:15px system-ui}header{border-bottom:1px solid #3d3527;padding:24px max(5vw,20px);display:flex;justify-content:space-between;align-items:center;gap:15px}h1,h2{font-family:Georgia;font-weight:normal;margin:8px 0}h1{font-size:clamp(28px,4vw,44px)}small,.muted{color:#b8ae9c} .brand{color:#d9b66d;letter-spacing:3px;font-size:11px}main{max-width:1250px;margin:auto;padding:30px 20px}button,input,select{font:inherit;border:1px solid #514631;border-radius:8px;padding:11px;background:#22231f;color:#f6efdf}button{cursor:pointer}button:hover{border-color:#e5c17b}button.primary{background:#d9b66d;color:#161611;font-weight:bold}button:disabled{opacity:.5}form{max-width:420px;margin:40px auto;background:#1c1d19;padding:25px;border:1px solid #514631;border-radius:16px}form input,form button{width:100%;margin:7px 0}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin:24px 0}.stat,article{background:#1c1d19;border:1px solid #3d3527;border-radius:14px;padding:20px}.stat strong{display:block;font-size:28px;color:#e3c17d;margin-top:8px}.filters,.actions{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}.badge{float:right;border-radius:20px;padding:6px 10px;background:#514126;color:#ffe2a2;font-size:12px}.Completed{background:#234333;color:#bce9c9}.Preparing{background:#493820;color:#ffd38b}.line{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #34342c}.total{font-size:23px;color:#e3c17d;margin:15px 0}footer{text-align:center;padding:30px;color:#b8ae9c;font-size:12px}[hidden]{display:none!important}#receipt{display:none}@media print{body{background:white;color:black}header,main,footer{display:none!important}#receipt{display:block;padding:20px;font:15px monospace}#receipt .line{border-color:#ddd}}
</style></head><body><header><div><div class="brand">MAISON CAFÉ / MANAGEMENT</div><h1>Owner dashboard</h1></div><button id="logout" hidden>Sign out</button></header><main><form id="login"><h2>Owner access</h2><input id="email" type="email" placeholder="Owner email" required autocomplete="username"><input id="password" type="password" placeholder="Password" required autocomplete="current-password"><button class="primary">Sign in</button></form><p id="msg" role="status"></p><section id="panel" hidden><div class="brand">SERVICE OVERVIEW</div><h2>Today's activity</h2><small>Local device date · latest 100 orders only · completed value is not verified payment</small><div class="stats" id="stats"></div><div class="filters"><input id="search" placeholder="Search table, item or notes" aria-label="Search orders"><select id="status" aria-label="Status"><option>All statuses</option><option>Pending</option><option>Preparing</option><option>Completed</option></select><input type="date" id="date" aria-label="Order date"><button id="clear">Clear filters</button><button id="sound">Enable sound alerts</button></div><div id="orders" class="grid"></div></section></main><footer>MAISON CAFÉ · POWERED BY ARV DIGITAL STUDIO</footer><section id="receipt"></section><script type="module">import {initializeApp} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
const firebaseConfig = {
    apiKey: "AIzaSyC6cpzVRDsVdHv2ETvs9V6WvEMRyrRKsEg",
    authDomain: "maison-cafe-c5be1.firebaseapp.com",
    projectId: "maison-cafe-c5be1",
    storageBucket: "maison-cafe-c5be1.firebasestorage.app",
    messagingSenderId: "382614698785",
    appId: "1:382614698785:web:626b45e203f3a68a605c60"
  };
const app=initializeApp(firebaseConfig);
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";import {getFirestore,collection,onSnapshot,query,orderBy,limit,updateDoc,doc} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";const owner='ilx9MCtPvXRx7lZHp6ke2hqzsXm2';const auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);let unsub;const names=['Cappuccino','Iced Latte','Americano','Margherita Pizza','Veg Burger','White Sauce Pasta','Chocolate Brownie','Cheesecake'],prices=[149,179,119,299,199,249,159,229];
let rows=[],seen=new Set(),ready=false,audio=null,epoch=0;
const statuses=['Pending','Preparing','Completed'];const money=n=>'₹'+n.toLocaleString('en-IN');const el=(tag,t,cls)=>{const e=document.createElement(tag);if(t!==undefined)e.textContent=t;if(cls)e.className=cls;return e};
const day=d=>d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`:'';
const total=x=>prices.reduce((s,v,i)=>s+v*(x.quantities?.[i]||0),0);const items=x=>names.map((n,i)=>({n,q:x.quantities?.[i]||0,p:prices[i]})).filter(i=>i.q>0);
function beep(){if(!audio||audio.state!=='running')return;const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=740;g.gain.value=.12;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.22)}
$('sound').onclick=async()=>{try{audio??=new (window.AudioContext||window.webkitAudioContext)();await audio.resume();beep();$('sound').textContent='Sound alerts enabled'}catch(e){$('msg').textContent='Sound unavailable on this device'}};
function bill(x){const r=$('receipt');r.replaceChildren(el('h2','Maison Café'),el('p','Order summary · Table '+x.table),el('p',x.date?.toLocaleString()||''),el('p','Order '+x.id));for(const i of items(x)){const l=el('div',undefined,'line');l.append(el('span',i.q+' × '+i.n),el('span',money(i.q*i.p)));r.append(l)}r.append(el('h2','Total '+money(total(x))),el('p','Status: '+x.status),el('p','Payment not verified · not a tax invoice'));window.print()}
function render(){const today=rows.filter(x=>day(x.date)===day(new Date()));$('stats').replaceChildren();for(const [k,v] of [['Orders today',today.length],['Pending',today.filter(x=>x.status==='Pending').length],['Preparing',today.filter(x=>x.status==='Preparing').length],['Completed',today.filter(x=>x.status==='Completed').length],['Completed value',money(today.filter(x=>x.status==='Completed').reduce((s,x)=>s+total(x),0))]]){const a=el('div',undefined,'stat');a.append(el('small',k),el('strong',v));$('stats').append(a)}const term=$('search').value.toLowerCase().trim();const filtered=rows.filter(x=>($('status').value==='All statuses'||x.status===$('status').value)&&(!$('date').value||day(x.date)===$('date').value)&&(!term||('table '+x.table+' '+items(x).map(i=>i.n).join(' ')+' '+(x.notes||'')).toLowerCase().includes(term)));$('orders').replaceChildren();if(!filtered.length)$('orders').append(el('p','No matching orders.'));for(const x of filtered){const a=el('article');a.append(el('span',x.status,'badge '+(statuses.includes(x.status)?x.status:'')),el('h2','Table '+x.table),el('small',x.date?.toLocaleString()||'Time unavailable'));for(const i of items(x)){const l=el('div',undefined,'line');l.append(el('span',i.q+' × '+i.n),el('span',money(i.q*i.p)));a.append(l)}a.append(el('p','Notes: '+(x.notes||'—')),el('div',money(total(x)),'total'));const controls=el('div',undefined,'actions');for(const status of statuses){const b=el('button',status,status===x.status?'primary':'');b.disabled=status===x.status;b.onclick=async()=>{b.disabled=true;try{await updateDoc(doc(db,'orders',x.id),{status})}catch(e){$('msg').textContent='Update failed: '+e.code;b.disabled=false}};controls.append(b)}const b=el('button','Print bill');b.onclick=()=>bill(x);controls.append(b);a.append(controls);$('orders').append(a)}}
for(const id of ['search','status','date'])$(id).addEventListener('input',render);$('clear').onclick=()=>{$('search').value='';$('status').selectedIndex=0;$('date').value='';render()};
$('login').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value)}catch(e){$('msg').textContent='Sign-in failed: '+e.code}finally{$('password').value=''}};$('logout').onclick=()=>signOut(auth);onAuthStateChanged(auth,u=>{const current=++epoch;if(unsub)unsub();rows=[];seen.clear();ready=false;$('orders').replaceChildren();$('stats').replaceChildren();$('receipt').replaceChildren();const ok=u?.uid===owner;$('panel').hidden=!ok;$('login').hidden=!!u;$('logout').hidden=!u;$('msg').textContent=ok?'Loading orders…':u?'Not authorized. Sign out and use owner account.':'Sign in to view orders.';if(!ok)return;unsub=onSnapshot(query(collection(db,'orders'),orderBy('createdAt','desc'),limit(100)),snap=>{if(current!==epoch)return;const fresh=snap.docs.some(d=>!seen.has(d.id));if(ready&&fresh)beep();snap.docs.forEach(d=>seen.add(d.id));ready=true;rows=snap.docs.map(d=>{const x=d.data();return {...x,id:d.id,date:x.createdAt?.toDate?.()}});$('msg').textContent=snap.size+' recent orders'+(snap.metadata.fromCache?' · cached':' · connected');render()},e=>{if(current!==epoch)return;rows=[];render();$('msg').textContent='Database error: '+e.code})});
</script></body></html>
