<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maison Café | Order at your table</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f0e5;color:#38271e;font:16px system-ui}header{background:#302219;color:#f6e8ce;padding:36px 20px;text-align:center}h1{font:48px Georgia;margin:8px}small{letter-spacing:2px}main{max-width:900px;margin:auto;padding:20px}button,select{font:inherit;border:1px solid #cbbba4;border-radius:10px;padding:10px;background:#fffaf0;color:#38271e}button{cursor:pointer}button:focus-visible{outline:3px solid #b67b32}nav{display:flex;gap:8px;overflow:auto;padding:15px 0}nav button.active,.primary{background:#523522;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px}.card{background:#fffaf1;border:1px solid #e1d4c0;border-radius:16px;padding:16px}.icon{font-size:45px;background:#eee0cc;border-radius:10px;text-align:center;padding:18px}.card h3{margin:12px 0 4px}.card p{font-size:13px;min-height:36px}.card button{width:100%}.cart{margin-top:25px;background:white;padding:20px;border-radius:16px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #eee}.row button{padding:5px 10px}.primary{width:100%;margin-top:12px}footer{text-align:center;padding:24px;font-size:12px}#notice{white-space:pre-wrap;background:#f6f0e5;padding:12px;border-radius:8px}a{color:inherit}</style><header><small>MAISON • CAFÉ</small><h1>Good food. Slow moments.</h1><p>Order from the comfort of your table.</p><small>DEMONSTRATION MENU</small></header><main><label for="table">Your table: </label><select id="table"><option value="">Choose table</option></select><nav id="cats" aria-label="Menu categories"></nav><div class="grid" id="menu"></div><section class="cart"><h2>Your order</h2><div id="items"></div><h3 id="total"></h3><button class="primary" id="order">Preview WhatsApp order</button><p id="notice" hidden role="status"></p><p><small>Demo only. No real order or payment is processed.</small></p></section></main><footer>Maison Café — Concept by ARV Digital Studio</footer><script>
const WHATSAPP_NUMBER=''; // Set a consenting cafe's business number with country code, digits only.
const foods=[['Coffee','Cappuccino',149,'☕','Espresso and silky milk'],['Coffee','Iced Latte',179,'🧋','Chilled espresso and milk'],['Coffee','Americano',119,'☕','Classic black coffee'],['Food','Margherita Pizza',299,'🍕','Tomato, mozzarella and basil'],['Food','Veg Burger',199,'🍔','Vegetable patty and fresh greens'],['Food','White Sauce Pasta',249,'🍝','Creamy pasta with herbs'],['Desserts','Chocolate Brownie',159,'🍫','Rich chocolate dessert'],['Desserts','Cheesecake',229,'🍰','Creamy classic cheesecake']];let cart={},cat='All';const $=id=>document.getElementById(id);for(let i=1;i<=20;i++)$('table').add(new Option('Table '+i,i));let t=new URLSearchParams(location.search).get('table');if(/^([1-9]|1[0-9]|20)$/.test(t||''))$('table').value=t;function render(){ $('cats').innerHTML=['All','Coffee','Food','Desserts'].map(c=>`<button class="${c===cat?'active':''}" onclick="category('${c}')">${c}</button>`).join('');$('menu').innerHTML=foods.map((f,i)=>cat==='All'||f[0]===cat?`<article class="card"><div class="icon">${f[3]}</div><h3>${f[1]}</h3><p>${f[4]}</p><strong>₹${f[2]}</strong><button onclick="change(${i},1)">Add +</button></article>`:'').join('');drawCart()}function category(c){cat=c;render()}function change(i,n){cart[i]=Math.max(0,(cart[i]||0)+n);if(!cart[i])delete cart[i];drawCart()}function total(){return Object.entries(cart).reduce((s,[i,q])=>s+foods[i][2]*q,0)}function drawCart(){$('items').innerHTML=Object.entries(cart).map(([i,q])=>`<div class="row"><span>${foods[i][1]}<br>₹${foods[i][2]*q}</span><span><button aria-label="Remove one ${foods[i][1]}" onclick="change(${i},-1)">−</button> ${q} <button aria-label="Add one ${foods[i][1]}" onclick="change(${i},1)">+</button></span></div>`).join('')||'Your cart is empty.';$('total').textContent='Total: ₹'+total();$('notice').hidden=true}if(WHATSAPP_NUMBER)$('order').textContent='Send order on WhatsApp';$('order').onclick=()=>{let notice=$('notice');notice.hidden=false;if(!total()||!$('table').value){notice.textContent='Please choose a table and add food first.';return}let msg='Maison Café — Order request\nTable '+$('table').value+'\n'+Object.entries(cart).map(([i,q])=>q+' × '+foods[i][1]+' — ₹'+foods[i][2]*q).join('\n')+'\nTotal: ₹'+total()+'\nPlease confirm availability and final bill.';notice.textContent=msg+(WHATSAPP_NUMBER?'':'\n\nDemo preview only — no message sent.');if(WHATSAPP_NUMBER)window.open('https://wa.me/'+WHATSAPP_NUMBER+'?text='+encodeURIComponent(msg),'_blank','noopener,noreferrer')};$('table').onchange=()=>{$('notice').hidden=true};render();</script></html>
